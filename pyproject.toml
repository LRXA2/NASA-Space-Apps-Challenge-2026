[project]
name = "nasa-space-apps-terrain"
version = "0.1.0"
description = "Earth-to-Moon terrain similarity, mobility, and environment analysis"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.2.3",
    "pandas==2.2.3",
    "scipy==1.15.2",
]

[project.optional-dependencies]
# Earth/lunar raster processing and the exploratory notebooks.
processing = [
    "affine==3.0.1",
    "ipykernel>=6,<8",
    "matplotlib==3.11.2",
    "nbclient==0.11.0",
    "nbformat==5.11.1",
    "osmium==4.3.2",
    "pyproj==3.7.1",
    "rasterio==1.5.2",
    "shapely==2.0.7",
]

# CNN training, inference, and browser-export parity checks. The shared lock
# deliberately uses CPU wheels so it is portable to machines without CUDA.
model = [
    "onnxruntime>=1.23,<2",
    "torch==2.9.1",
]

# Dataset acquisition scripts.
download = [
    "beautifulsoup4==4.15.0",
    "requests==2.34.2",
]

# Environmental scoring and the extended lunar-science EDA workflow.
environment = [
    "cdflib==1.3.6",
    "cftime==1.6.6.1",
    "lxml==6.1.3",
    "netCDF4==1.7.5.1.post1",
    "obspy==1.5.1",
    "pillow==13.0.0",
    "PyYAML==6.0.3",
    "spiceypy==8.3.0",
    "SQLAlchemy==2.1.8",
]

# Test and code-quality tools used locally and in CI.
test = [
    "pytest>=8.3,<10",
    "ruff>=0.14,<1",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = [
    "download scripts/tests",
    "env_algo_task",
    "integration/tests",
    "notebooks/modeling/terrain_similarity/tests",
    "notebooks/shared/tests",
    "operational_cnn/tests",
    "app/scripts/tests",
]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [
    "app/public/data/environment/scorer",
    "data",
]
