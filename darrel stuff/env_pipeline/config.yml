    - column: context_p1_spacecraft_potential_V
      unit: V (All Qs)
      role: context
      evidence_family: context_p1_spacecraft_potential_V
      multiplier: 1.0
      requires_time_window: false
      preference: null
      hard_gate: null
  dust:
    priority: Medium
    include_in_score: true
    multiplier: null
    metrics:
    - column: reference_ldex_current_e_per_s
      unit: Elementary_charge_per_second
      role: context
      evidence_family: reference_ldex_current_e_per_s
