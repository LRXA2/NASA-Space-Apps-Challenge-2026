# Standalone CSV scorer. No project helpers, source lookups or sidecar files.
# null = not configured, never an automatic pass or a zero substitute.
# Domain multiplier = relative importance in the final weighted average.
# Metric multiplier = relative importance within that domain (not a unit conversion).
# hard_gate.threshold / lower / upper = mandatory environmental screening limits.
# preference.lower / upper = utility bounds, not automatically safety limits.
# context fields cannot be used for hard gates or scoring.
# No scientific thresholds or domain multipliers have been adopted here.
# above_threshold means >=; below_threshold means <=; between includes both bounds.
# Metric multiplier 1.0 means equal weighting within a domain; context weights are unused.
# Domain multipliers are null until explicitly chosen; priority labels do not set them.
# priority is descriptive only (Highest/High/etc.), never an automatic scoring weight.
schema: 1
body: Moon
name: moon_environment_unconfigured
metadata_columns:
- candidate_id
- start_utc
- stop_utc
domains:
  radiation:
    priority: Highest
    include_in_score: true
    multiplier: null
    metrics:
    - column: median_visible_sky_fraction
      unit: fraction
      role: context
      evidence_family: geometry_sky_visible_fraction_4pi
      multiplier: 1.0
      requires_time_window: false
      preference: null
      hard_gate: null
    - column: orbital_radiation_counter_median
      unit: counts/SEC record
      role: context
      evidence_family: context_crater_counter_median
      multiplier: 1.0
      requires_time_window: false
      preference: null
      hard_gate: null
    - column: orbital_radiation_counter_maximum
      unit: counts/SEC record
      role: context
      evidence_family: context_crater_reported_daily_max
      multiplier: 1.0
      requires_time_window: false
      preference: null
      hard_gate: null

  uv:
    priority: Medium
    include_in_score: true
    multiplier: null
    metrics:
    - column: median_solar_far_uv_irradiance_w_m2
      unit: W/m2
      role: context
      evidence_family: context_see_fuv_115_180_W_m2
      multiplier: 1.0
      requires_time_window: false
      preference: null
      hard_gate: null

  solar_illumination:
    priority: High
    include_in_score: true
    multiplier: null
    metrics:
    - column: median_sun_visibility_fraction
      unit: fraction
      role: score
      evidence_family: solar_visibility_median
      multiplier: 1.0
      requires_time_window: false
      preference:
        direction: higher
        lower: 0.0
        upper: 1.0
      hard_gate:
        operator: above_threshold
        threshold: null
        rationale: Set an explicitly chosen environmental screening threshold; not
          a NASA-approved limit
      minimum: 0
      maximum: 1
    - column: permanently_shadowed_cell_fraction
      unit: fraction
      role: context
      evidence_family: geometry_psr_fraction_cells
      multiplier: 1.0
      requires_time_window: false
      preference: null
      hard_gate: null
      minimum: 0
      maximum: 1
    - column: regional_reference_sun_visibility_fraction
      unit: fraction
      role: context
      evidence_family: reference_region_2020_2021_sun_clear_fraction
      multiplier: 1.0
      requires_time_window: false
      preference: null
      hard_gate: null
    - column: regional_reference_longest_shadow_sample_span_hours
      unit: h
      role: context
      evidence_family: reference_region_2020_2021_blocked_sample_span_h
      multiplier: 1.0
      requires_time_window: false
      preference: null
      hard_gate: null

  thermal:
    priority: Highest
    include_in_score: true
    multiplier: null
    metrics:
    - column: lowest_phase_median_temperature_kelvin
      unit: K
      role: context
      evidence_family: thermal_phase_median_min_K
      multiplier: 1.0
      requires_time_window: false
      preference: null
      hard_gate: null
    - column: highest_phase_median_temperature_kelvin
      unit: K
      role: context
      evidence_family: thermal_phase_median_max_K
      multiplier: 1.0
      requires_time_window: false
      preference: null
      hard_gate: null
    - column: phase_median_temperature_range_kelvin
      unit: K
      role: context
      evidence_family: thermal_phase_median_span_K
      multiplier: 1.0
      requires_time_window: false
      preference: null
      hard_gate: null

  plasma_charging:
    priority: Medium
    include_in_score: true
    multiplier: null
    metrics:
    - column: median_spacecraft_ion_density_per_cm3
      unit: cm^-3 (All Qs)
      role: context
      evidence_family: context_p1_full_ion_density_cm3
      multiplier: 1.0
      requires_time_window: false
      preference: null
      hard_gate: null
    - column: median_spacecraft_electron_density_per_cm3
      unit: cm^-3 (All Qs)
      role: context
      evidence_family: context_p1_full_electron_density_cm3
      multiplier: 1.0
      requires_time_window: false
      preference: null
      hard_gate: null
    - column: median_spacecraft_electric_potential_volts
      unit: V (All Qs)
      role: context
      evidence_family: context_p1_spacecraft_potential_V
      multiplier: 1.0
      requires_time_window: false
      preference: null
      hard_gate: null

  dust:
    priority: Medium
    include_in_score: true
    multiplier: null
    metrics:
    - column: historical_median_dust_detector_current_charges_per_second
      unit: Elementary_charge_per_second
      role: context
      evidence_family: reference_ldex_current_e_per_s
      multiplier: 1.0
      requires_time_window: false
      preference: null
      hard_gate: null

  seismic:
    priority: Evidence-dependent
    include_in_score: true
    multiplier: null
    metrics:
    - column: historical_median_vertical_seismic_rms_counts
      unit: counts
      role: context
      evidence_family: reference_apollo_s12_mhz_rms_counts
      multiplier: 1.0
      requires_time_window: false
      preference: null
      hard_gate: null

  exosphere:
    priority: Context initially
    include_in_score: true
    multiplier: null
    metrics:
    - column: historical_median_orbital_helium_density_per_cm3
      unit: P/Cc
      role: context
      evidence_family: reference_nms_He_abundance_p_cc
      multiplier: 1.0
      requires_time_window: false
      preference: null
      hard_gate: null
