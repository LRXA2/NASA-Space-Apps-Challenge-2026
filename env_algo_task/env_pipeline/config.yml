      evidence_family: geometry_sky_visible_fraction_4pi
      multiplier: 1.0
      requires_time_window: false
      preference: null
      hard_gate: null
      meaning: Context measurement; not a qualified mission requirement.
      minimum: 0
      maximum: 1
    - column: orbital_radiation_counter_median
      unit: counts/SEC record
      role: score
      evidence_family: context_crater_counter_median
      multiplier: 1.0
      requires_time_window: false
      preference:
        direction: lower
        lower: 24.0
        upper: 104.5
      hard_gate: null
      meaning: Experimental environmental comparison preference; not an operational
