# Pipeline modes: strict | available_data
# Selected flow-specific gates are project demonstrations, not NASA or hardware limits.
# Gate rules do not change the existing scoring curves or assessment weights.

schema: 2
body: Moon
name: south_pole_environment_comparison
pipeline_mode: strict
comparison_group_columns: []
metadata_columns:
- sample_type
- comparison_scale
- region
- declaration_year
- declaration_source
- footprint_bounds_m
- evidence_note
- candidate_id
- start_utc
- stop_utc
assessments:
  operations:
    weights:
      solar_illumination: 30.0
      earth_visibility: 25.0
      dust: 15.0
      soil: 10.0
      thermal: 15.0
      plasma_charging: 5.0
    domain_overrides: {}
    metric_overrides:
      window_continuous_sunlight_hours:
        role: gate
        hard_gate:
          operator: above_threshold
          threshold: 24.0
          cap_to_window_duration: true
          rationale: Project demonstration minimum sunlight duration; NOT a NASA mission requirement.
      median_earth_visibility_fraction:
        hard_gate:
          operator: above_threshold
          threshold: 0.30
          rationale: Project demonstration Earth-visibility minimum; NOT an RF link or NASA requirement.
  survival:
    weights:
      radiation: 40.0
      thermal: 35.0
      plasma_charging: 15.0
      uv: 10.0
    domain_overrides: {}
    metric_overrides:
      highest_phase_median_temperature_kelvin:
        role: gate
        hard_gate:
          operator: below_threshold
          threshold: 390.0
          rationale: Project demonstration temperature ceiling; NOT a qualified hardware or crew limit.
      median_spacecraft_electric_potential_volts:
        hard_gate:
          operator: between
          lower: -15.0
          upper: 10.0
          rationale: Project demonstration spacecraft-potential range; NOT a surface-charging or arcing limit.
domains:
  radiation:
    enabled: true
    hard_gates_enabled: True
    priority: Highest
    include_in_score: true
    multiplier: 1.0
    metrics:
    - column: median_visible_sky_fraction
      unit: fraction
      role: context
      evidence_family: geometry_sky_visible_fraction_4pi
      multiplier: 1.0
      requires_time_window: false
      preference: null
      hard_gate: null
      meaning: Context measurement; not a qualified mission requirement.
      minimum: 0
      maximum: 1
    - column: orbital_radiation_counter_median
      unit: counts/SEC record
      role: score
      evidence_family: context_crater_counter_median
      multiplier: 1.0
      requires_time_window: false
      preference:
        direction: lower
        lower: 24.0
        upper: 104.5
      hard_gate: null
      meaning: Experimental environmental comparison preference; not an operational
        or safety limit.
      minimum: 0
    - column: orbital_radiation_counter_maximum
      unit: counts/SEC record
      role: context
      evidence_family: context_crater_reported_daily_max
      multiplier: 1.0
      requires_time_window: false
      preference: null
      hard_gate: null
      meaning: Context measurement; not a qualified mission requirement.
      minimum: 0
  uv:
